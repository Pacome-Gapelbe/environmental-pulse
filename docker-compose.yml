version: "3"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.3-python3.10
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    # Environmental DB
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: envpulse
    DB_USER: postgres
    DB_PASSWORD: postgres
    # API Keys
    OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - /var/run/docker.sock:/var/run/docker.sock
    - .:/opt/airflow/environmental-pulse
  user: "${AIRFLOW_UID:-50000}:0"
  

services:
  # Airflow metadata DB
  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 30s
      timeout: 30s
      retries: 5

  # Environmental DB
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: envpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-environmental-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 30s
      retries: 5

  # Airflow
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    depends_on:
      postgres-airflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - 8081:8080
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  python-etl:
    build: .
    container_name: etl-service
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo '⏳ Waiting for Postgres...';
        until pg_isready -h postgres -p 5432 -U postgres; do
          sleep 2;
        done;
        echo '✅ Postgres is ready, starting ETL...';
        python src/data_ingestion.py
      "
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - NASA_FIRMS_API_KEY=${NASA_FIRMS_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=envpulse
    volumes:
      - .:/app

  # Streamlit dashboard
  streamlit-dashboard:
    build: .
    container_name: streamlit-dashboard
    command: ["streamlit", "run", "src/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=envpulse
    volumes:
      - .:/app

volumes:
  postgres-airflow-data:
  postgres_data:






























